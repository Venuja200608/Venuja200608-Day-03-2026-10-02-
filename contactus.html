<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SpaceX</title>
</head>
<body>
    <h1>Contact Us</h1>
    <p>If you have any questions, comments, or inquiries about SpaceX, please feel free to reach out to us using the form below. We value your feedback and will do our best to respond promptly.</p>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4"></textarea><br><br>

        <button type="submit">Send Message</button>
    </form>

    <br>
    <a href="spaceX.html"> Back to Home</a>
</body>
</html>
